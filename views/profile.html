<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit profile - HMS</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="profile">
  <header class="nav">
    <span class="brand">HMS</span>
    <nav>
      <a href="/dashboard">Dashboard</a>
      <a href="/profile">Profile</a>
      <button id="logout-btn" type="button">Log out</button>
    </nav>
  </header>
  <main class="wrap">
    <h1>Edit profile</h1>
    <div id="msg" class="msg" hidden></div>
    <form id="profile-form" class="card" novalidate>
      <label>Full name <input type="text" name="full_name" maxlength="100" required></label>
      <label>Email <input type="email" name="email" required></label>
      <fieldset>
        <legend>Change password <small>(optional)</small></legend>
        <label>Current password <input type="password" name="current_password" autocomplete="current-password"></label>
        <label>New password <input type="password" name="new_password" autocomplete="new-password" minlength="8"></label>
      </fieldset>
      <button type="submit" class="primary">Save changes</button>
    </form>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
